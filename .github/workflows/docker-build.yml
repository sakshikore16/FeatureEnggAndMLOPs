name: CI/CD Pipeline - Test & Docker Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit & API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd MiniProject
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          cd MiniProject
          pytest tests/ -v

  docker-build:
    name: Build & Push Docker Image to Docker Hub
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          cd MiniProject
          docker build -t ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_USERNAME || 'local' }}/spotify-metrics:latest .

      - name: Push to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        continue-on-error: true
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/spotify-metrics:latest
